<!DOCTYPE html>
<html>
<body>
<script src="https://cdn.jsdelivr.net/npm/svgaplayerweb@2.3.2/build/svga.min.js"></script>
<input type="file" id="file" />
<script>
document.getElementById('file').addEventListener('change', function(e) {
  var file = e.target.files[0];
  var reader = new FileReader();
  reader.onload = function(e) {
    var arrayBuffer = e.target.result;
    var parser = new SVGA.Parser();
    var blob = new Blob([arrayBuffer]);
    var url = URL.createObjectURL(blob);
    parser.load(url, function(videoItem) {
      console.log('audios:', videoItem.audios);
      if (videoItem.audios && videoItem.audios.length > 0) {
        var key = videoItem.audios[0].audioKey;
        console.log('audioKey:', key);
        var data = videoItem.images[key];
        console.log('data:', data);
      }
    });
  }
  reader.readAsArrayBuffer(file);
});
</script>
</body>
</html>
